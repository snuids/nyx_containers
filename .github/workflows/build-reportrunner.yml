name: Build and Push ReportRunner Multi-Platform Container

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Dockerfiles/Dockerfilereportrunner'
      - 'sources/**'
      - '.github/workflows/build-reportrunner.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'reportrunner:v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from commit message
        id: extract_version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oP 'reportrunner:v\K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          if [ -z "$VERSION" ]; then
            echo "ERROR: No version found in commit message. Expected format: reportrunner:v1.0.0"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfiles/Dockerfilereportrunner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nyx-reportrunner:v${{ steps.extract_version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/nyx-reportrunner:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nyx-reportrunner:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/nyx-reportrunner:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed successfully with version v${{ steps.extract_version.outputs.version }}"
